<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9 Z" fill="#2C2C2A"/>
    </marker>
  </defs>

  <!-- A / B / C 竖排，正常 -->
  <rect x="40" y="30" width="100" height="40" rx="20" fill="#fff" stroke="#2C2C2A" stroke-width="1.3"/>
  <text x="90" y="55" text-anchor="middle" font-size="12" fill="#2C2C2A">开始</text>
  <rect x="40" y="120" width="100" height="40" fill="#fff" stroke="#2C2C2A" stroke-width="1.3"/>
  <text x="90" y="145" text-anchor="middle" font-size="12" fill="#2C2C2A">用户登录并校验权限</text>
  <rect x="40" y="210" width="140" height="40" fill="#fff" stroke="#2C2C2A" stroke-width="1.3"/>
  <text x="110" y="235" text-anchor="middle" font-size="12" fill="#2C2C2A">入库</text>

  <line x1="90" y1="70" x2="90" y2="120" stroke="#2C2C2A" stroke-width="1.3" marker-end="url(#ar)"/>
  <line x1="90" y1="160" x2="90" y2="210" stroke="#2C2C2A" stroke-width="1.3" marker-end="url(#ar)"/>

  <!-- 缺陷 1：线从 B 右侧出发，横穿 D 这个图元，再落到 E 上（箭尖贴合，几何上"合法"） -->
  <rect x="240" y="110" width="80" height="60" fill="#fff" stroke="#2C2C2A" stroke-width="1.3"/>
  <text x="280" y="145" text-anchor="middle" font-size="12" fill="#2C2C2A">D 被穿过</text>
  <rect x="340" y="110" width="50" height="60" fill="#fff" stroke="#2C2C2A" stroke-width="1.3"/>
  <text x="365" y="145" text-anchor="middle" font-size="12" fill="#2C2C2A">E</text>
  <line x1="140" y1="140" x2="340" y2="140" stroke="#2C2C2A" stroke-width="1.3" marker-end="url(#ar)"/>

  <!-- 缺陷 2：箭尖悬在空地，附近没有任何图元 -->
  <line x1="200" y1="280" x2="180" y2="200" stroke="#2C2C2A" stroke-width="1.3" marker-end="url(#ar)"/>

  <!-- 缺陷 3：两条线互相交叉 -->
  <line x1="240" y1="250" x2="390" y2="250" stroke="#2C2C2A" stroke-width="1.3"/>
  <line x1="300" y1="230" x2="300" y2="290" stroke="#2C2C2A" stroke-width="1.3"/>

  <!-- 缺陷 4：图元重叠（两个框压在一起） -->
  <rect x="220" y="30" width="90" height="50" fill="#fff" stroke="#2C2C2A" stroke-width="1.3"/>
  <rect x="260" y="50" width="90" height="50" fill="#fff" stroke="#2C2C2A" stroke-width="1.3"/>

  <!-- 缺陷 5：线跑出画布 -->
  <line x1="380" y1="20" x2="470" y2="20" stroke="#2C2C2A" stroke-width="1.3"/>
</svg>
